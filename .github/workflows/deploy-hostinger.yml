name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Altere para o nome do seu branch principal se for diferente

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ajustar config.php para produção
        run: |
          cp .github/workflows/config-producao.php config.php
          sed -i "s/MOODLE_DB_PASS/${{ secrets.MOODLE_DB_PASS }}/g" config.php

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./
          # Hostinger usually exposes /public_html as upload root.
          server-dir: /public_html/ava/moodle/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            config.php.bak
            add_out.txt
            commit_out.txt
            commit2_out.txt
