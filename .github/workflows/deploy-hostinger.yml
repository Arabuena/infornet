name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH/rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ajustar config.php para produção
        run: |
          cp .github/workflows/config-producao.php config.php
          sed -i "s/MOODLE_DB_PASS/${{ secrets.MOODLE_DB_PASS }}/g" config.php

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync sobre SSH
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='config.php.bak' \
            --exclude='add_out.txt' \
            --exclude='commit_out.txt' \
            --exclude='commit2_out.txt' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/arabuena.com/public_html/ava/moodle/

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
